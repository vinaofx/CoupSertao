 const go=o.me?(await ask(`${cl.name} diz ser ${chip(role)}${RK[role]}. Contestar?`,[ico('contestar')+'Contestar',ico('passar')+'Deixar passar']))===0:Math.random()<.4/P.length;

  if(has(cl,role)){say(`${cl.name} mostra ${RK[role]}! ${o.name} perde uma influência.`);const c=alive(cl).find(c=>c.r===role);deck.push(c.r);sh(deck);c.r=deck.shift();await lose(o,`${cl.name} tinha ${RK[role]}!`);return true}

async function block(actor,roles,t,nm){for(const b of t?[t]:P.filter(x=>!x.out&&x!==actor)){if(b.out)continue;let r=null;

 for(let j=0;j<keep;j++){const i=p.me?await ask(keep===1?'Escolha a carta que vai ficar com você:':`Escolha sua ${j+1}ª carta:`,pool.map(c=>chip(c.r)+RK[c.r])):Math.random()*pool.length|0;kept.push(pool.splice(i,1)[0].r)}
 pool.forEach(c=>deck.push(c.r));sh(deck);alive(p).forEach((c,i)=>c.r=kept[i]);say(`${p.name} trocou ${n} carta(s).`)}

 if(sw){deck.push(c.r);sh(deck);c.r=deck.shift();say(`${t.name} foi forçado a trocar a carta.`)}else{if(p.me)c.seen=c.r;say(`${t.name} ficou com a carta.`)}}

 const ks=Object.keys(ACTS).filter(k=>k!=='golpe'&&ok(p,k)),own=ks.filter(k=>ACTS[k].r&&has(p,ACTS[k].r));return rnd(own.length&&Math.random()<.6?own:ks)}
async function turn(p){P.forEach(x=>x.turn=x===p?1:0);draw();let k;
 if(p.me){banner({k:'turn',soft:1,ms:1000});const must=p.coins>=10,ks=Object.keys(ACTS).filter(k=>ok(p,k)&&(!must||k==='golpe'));k=ks[await ask('Sua vez! Escolher ação:',ks.map(actLab),1)]}

 if(t&&t.me)banner({k:'target',soft:1,sub:Ac.n,ms:1500});
 p.coins-=Ac.cost||0;draw();
 if(Ac.r&&!await challenge(p,Ac.r)){p.coins+=Ac.cost||0;draw();return}
 if(p.out||(t&&t.out))return;
