<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LÁBIA</title>
<meta name="theme-color" content="#f4ebdd">
<link rel="preload" href="assets/fonts/cordenilo-bold.woff" as="font" type="font/woff" crossorigin>
<style>
@font-face{font-family:Cordenilo;src:url(assets/fonts/cordenilo.woff) format('woff');font-weight:400;font-display:swap}
@font-face{font-family:Cordenilo;src:url(assets/fonts/cordenilo-bold.woff) format('woff');font-weight:700;font-display:swap}
*{box-sizing:border-box}
:root{--black:#17130f;--ow:#f4ebdd;--or:#b7472d;--gold:#e9a52d;--og:#c98232;--gray:#9d9388;--brown:#69441a;--f:Cordenilo,'Arial Black',system-ui,sans-serif;--t:Inter,system-ui,-apple-system,'Segoe UI',sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--ow);color:var(--black);font:14px/1.4 var(--t);-webkit-tap-highlight-color:transparent}
body.menu::before{content:'';position:fixed;inset:0;background:url(assets/fundo-menu.jpg) center/cover;mix-blend-mode:multiply;opacity:.08;pointer-events:none}
main{position:relative;max-width:1000px;margin:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
img{display:block}
.rg{position:relative;isolation:isolate}
.rg::before{content:'';position:absolute;inset:0;z-index:-1;border-radius:var(--r,12px);border:2px solid var(--bd,var(--brown));background:var(--bg,linear-gradient(#e9a52d,#c98232));box-shadow:var(--sh,0 4px 4px rgba(0,0,0,.16));filter:url(#rough)}
.btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:48px;padding:8px 16px;font:700 28px/1.1 var(--f);letter-spacing:.08em;text-transform:uppercase;text-align:center;text-shadow:0 2px 0 rgba(255,255,255,.08);color:var(--black)}
.btn:active,.ib:active{transform:translateY(3px)}
.btn.big{flex-direction:column;padding:18px 36px;font-size:32px;--bd:var(--og);--sh:0 4px 4px rgba(0,0,0,.16),0 6px 0 #613e17}
.btn.or{color:var(--ow);--bd:var(--or);--bg:linear-gradient(#d55d42,#b7472d)}
.btn.sm{font-size:22px;letter-spacing:.06em;justify-content:center;min-height:46px;padding:6px 10px;gap:8px;white-space:nowrap}
.bts.two .btn.sm{font-size:20px;letter-spacing:.04em}
.btn.mini{width:auto;font-size:24px;padding:8px 22px;flex:none}
.ib{display:grid;place-items:center;width:67px;height:67px;flex:none;color:var(--ow);--r:84px;--bd:var(--or);--bg:linear-gradient(#d55d42,#b7472d);--sh:0 4px 4px rgba(0,0,0,.16),0 6px 0 #8d3622}
.ib.mini{width:30px;height:30px;--sh:0 3px 0 #8d3622}
.ib.mini .ic{width:16px;height:16px}
.ic{display:inline-block;width:35px;height:35px;flex:none;background:currentColor;-webkit-mask:var(--i) center/contain no-repeat;mask:var(--i) center/contain no-repeat}
.ic.rob{width:18px;height:18px;color:var(--gold)}
.big .ic{height:36px}
@media(hover:hover){.btn[data-k]::after{content:attr(data-k);position:absolute;right:10px;top:50%;transform:translateY(-50%);font:12px var(--t);opacity:.7;border:1px solid currentColor;border-radius:4px;padding:0 5px}}
.mn{position:relative;display:inline-block;width:30px;height:30px;flex:none}
.mn img{position:absolute;left:-3.4px;top:-4px;width:37px;height:42px;max-width:none}
.mn.s{width:24px;height:24px}.mn.s img{left:-2.7px;top:-3.2px;width:29.6px;height:33.6px}
.card{position:relative;display:block;width:84px;height:116px;flex:none}
.card img,.mc img,.mn img{filter:drop-shadow(0 2px 1px rgba(0,0,0,.25))}
.logo{filter:drop-shadow(0 4px 4px rgba(0,0,0,.25))}
.card img{position:absolute;left:-3.5px;top:-1.6px;width:91px;height:124px;max-width:none}
.mc{position:relative;display:block;width:22px;height:30px;flex:none}
.mc img{position:absolute;left:-3.5px;top:-1.3px;width:30px;height:37px;max-width:none}
.pf{width:34px;height:34px;object-fit:contain;flex:none}
#menu{display:none;flex-direction:column;align-items:center;max-width:393px;min-height:calc(100vh - 24px);margin:0 auto;gap:20px}
.menu #menu{display:flex}
.menu .lay,.play #menu{display:none}
.logo-box{position:relative;width:100%;height:402px;display:flex;align-items:center;justify-content:center}
.sun{position:absolute;width:344px;height:344px;border-radius:50%;background:radial-gradient(circle,rgba(233,165,45,.28) 0,rgba(233,165,45,.16) 55%,rgba(233,165,45,0) 71%)}
.logo{position:relative;width:266px;height:200px}
.mb{width:100%;display:flex;flex-direction:column;align-items:center;gap:36px}
.cur{margin:0;text-align:center;font-size:14px}
.irow{display:flex;gap:12px;justify-content:center}
.top{display:flex;justify-content:space-between;width:100%;padding-top:12px}
.room{width:100%;padding:16px 16px 18px;text-align:center;color:var(--ow);display:flex;flex-direction:column;gap:6px;--r:8px;--bd:transparent;--bg:linear-gradient(#d55d42,#b7472d);--sh:none}
.room p{margin:0;font:400 20px var(--f);letter-spacing:.08em}
.code{font:700 64px/1 var(--f);letter-spacing:.1em;margin:0 0 8px}
.pls{display:grid;grid-template-columns:1fr 1fr;gap:10px 28px;width:100%;align-content:start}
.pill{position:relative;display:flex;align-items:center;gap:6px;height:42px;padding:4px 6px;background:var(--ow);border:2px solid var(--black);border-radius:32px;font:400 22px var(--f);letter-spacing:.08em;text-transform:uppercase;min-width:0}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pill.off{opacity:.5;border-color:var(--gray)}
.pill.add{opacity:.55;border-style:dashed;border-color:var(--gray)}
.pill .ib.mini{position:absolute;right:-12px;top:50%;margin-top:-15px}
.foot{margin-top:auto;width:100%;display:flex;flex-direction:column;gap:12px;padding-bottom:12px}
.wait{text-align:center;margin:0}
#ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:50;background:rgba(23,19,15,.62);padding:16px}
#ov.on{display:flex}
#ov.soft{background:none;pointer-events:none}
.mw{position:relative;width:332px;max-width:100%}
.mw>.x{position:absolute;top:-30px;right:-14px;z-index:2}
.modal{padding:18px 16px;display:flex;flex-direction:column;gap:14px;max-height:80vh;overflow:auto;--r:10px;--bd:var(--black);--bg:var(--ow);--sh:none}
.modal h2{margin:0;text-align:center;font:700 32px var(--f);letter-spacing:.08em}
.modal label{font:700 20px var(--f);letter-spacing:.04em;margin-bottom:-8px}
.modal p,.modal li{margin:0;font-size:14px}
.modal ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
input{font:16px var(--t);color:var(--black);background:#d6cec2;border:1px solid var(--gray);border-radius:6px;padding:12px 14px;min-width:0;width:100%}
input::placeholder{color:var(--gray)}
.row{display:flex;gap:10px;align-items:center}
.avs{display:grid;grid-template-columns:repeat(4,64px);justify-content:space-between;gap:10px}
.av{width:64px;height:64px;padding:0;display:grid;place-items:center;overflow:hidden;background:var(--gold);border:2px solid var(--black);border-radius:10px}
.av .pf{width:58px;height:58px}
.av.on{border-color:var(--or);box-shadow:0 0 0 2px var(--or)}
.er{color:var(--or);min-height:1.2em}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px}
.opt>span{font-size:18px}
.tg{display:flex;flex-wrap:wrap;gap:3px;justify-content:flex-end}
.tg button{font:700 24px var(--f);letter-spacing:.06em;padding:4px 12px;background:var(--black);color:var(--gray);border-radius:3px}
.tg button.on{background:var(--gold);color:var(--ow)}
.tg button.off.on{background:var(--or)}
.tg.n button{font-size:20px;padding:4px 9px}
.ch{display:flex;gap:10px;align-items:center}
.ch small{display:block;color:var(--gray);font-size:12.5px}
.bn{background:var(--ow);border:2px solid var(--black);border-radius:10px;padding:22px 26px;text-align:center;max-width:340px;box-shadow:0 10px 40px rgba(0,0,0,.4);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.bn h2{margin:10px 0 2px;font:700 28px/1.1 var(--f);letter-spacing:.06em;text-transform:uppercase}
.bn p{margin:0;color:var(--brown)}
.bn .card{margin:18px auto 50px;transform:scale(1.4);transform-origin:top center;animation:flip .6s}
.bn .bk{position:relative;width:66px;height:90px;margin:6px auto 4px}
.bn .bk img{position:absolute;left:-10.6px;top:-3.9px;width:90px;height:111px;max-width:none}
.bn.win{background:linear-gradient(#f6d46b,#e9a52d);border-color:var(--brown)}
.bn.bad{border-color:var(--or)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes flip{from{transform:scale(1.4) rotateY(90deg)}}
.lay{display:grid;gap:10px}
aside{display:contents}
#st{margin:0 0 8px;text-align:center;font-size:13px;color:var(--gray)}
#opp{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
#opp.dense{grid-template-columns:repeat(3,1fr);gap:6px}
.tile{background:var(--ow);border:2px solid var(--gray);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.th{display:flex;justify-content:space-between;align-items:center;gap:6px}
.nm{font:400 20px var(--f);letter-spacing:.08em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.co{display:flex;align-items:center;gap:4px;font:400 20px var(--f);flex:none}
.tc{display:flex;gap:12px}
.dense .tile{display:grid;grid-template-columns:1fr auto;align-items:center;padding:8px;gap:4px 4px}
.dense .th{display:contents}
.dense .nm{grid-column:1/-1;font-size:14px;letter-spacing:.04em}
.dense .tc{gap:4px}
.dense .co{font-size:15px;gap:2px}
.dense .mc{width:18px;height:24px}.dense .mc img{left:-2.8px;top:-1px;width:24px;height:29.6px}
.dense .mn.s{width:20px;height:20px}.dense .mn.s img{left:-2.3px;top:-2.7px;width:24.6px;height:28px}
.tile.turn{border-color:var(--or);box-shadow:0 0 0 2px var(--or)}
.tile.out{opacity:.4}.tile.offl{opacity:.6}
.tile.tgt{cursor:pointer;border-color:var(--or);box-shadow:0 0 0 3px var(--or),0 0 0 7px rgba(183,71,45,.18);animation:tg .8s infinite alternate}
@keyframes tg{to{transform:scale(1.04)}}
#mine{margin-top:4px}
.hand{background:var(--ow);border:2px solid var(--or);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;margin:0 auto}
.hand .th{padding:0 8px}.hand .nm,.hand .co{font-weight:700}
.hand.turn{box-shadow:0 0 0 3px rgba(183,71,45,.35)}.hand.out{opacity:.5}
.hc{display:flex;gap:12px;justify-content:center}
#log{background:var(--ow);border:1px solid var(--gray);border-radius:8px;padding:12px;height:130px;overflow:auto}
#log h4{margin:0 0 6px;font:400 16px var(--f);letter-spacing:.08em}
#log p{margin:0 0 4px;font:13.6px Georgia,serif;color:var(--gray)}
#log p:last-child{color:var(--black)}
#ask{display:flex;flex-direction:column;gap:12px;margin-top:auto}
#ask:empty{display:none}
#ask .q .mn{vertical-align:middle;margin:0 8px}
#ask .q{margin:0;font:700 16px/1.25 var(--t)}
.qh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bts{display:grid;grid-template-columns:1fr;gap:12px}
.bts.two{grid-template-columns:1fr 1fr}
.bts.two>button:last-child:nth-child(odd){grid-column:1/-1}
.cst{font:400 13px var(--t);opacity:.85;margin-left:2px}
#tb{display:none}
.rt{flex:1;display:flex;justify-content:center;align-items:center;gap:12px;padding:8px 16px;color:var(--ow);min-width:0;--r:12px;--bd:var(--or);--bg:linear-gradient(#d55d42,#b7472d);--sh:none}
.rt span{font:400 20px var(--f);letter-spacing:.11em}.rt b{font:700 24px var(--f);letter-spacing:.11em}
.hl p{margin:0 0 6px;font:500 14px/1.35 var(--t);color:var(--gray)}.hl p:last-child{color:var(--black)}
.modal .hs{color:var(--gray);text-align:center}
.cd{font:400 14px var(--t);color:var(--gray);letter-spacing:0}
@media(min-width:900px){.lay{grid-template-columns:1fr 380px;gap:20px;align-items:start}aside{display:flex;flex-direction:column;gap:10px;position:sticky;top:12px}#log{height:300px}#ask{margin-top:0}.hand{max-width:420px}}
@media(max-width:899px){body.play{position:fixed;inset:0;overflow:hidden}body.play main{height:100%;max-width:none;padding-left:16px;padding-right:16px}.lay{display:flex;flex-direction:column;gap:12px}section{display:contents}#tb{display:flex;align-items:center;gap:12px;height:44px;flex:none}#st,#log{display:none}#opp,#opp.dense{grid-template-columns:repeat(3,1fr);gap:8px}#ask:empty{display:block}.ib.mini .ic{width:18px;height:18px}}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="rough" x="-3%" y="-6%" width="106%" height="112%"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
<main>
<div id="menu"></div>
<div class="lay"><section><div id="tb"></div><p id="st"></p><div id="opp"></div><div id="mine"></div></section><aside><div id="log"></div><div id="ask"></div></aside></div>
</main>
<div id="ov"></div>
<script>
const $=s=>document.querySelector(s);
const RK={coronel:'Coronel',jagunco:'Jagunço',cangaceiro:'Cangaceiro',mascate:'Mascate',rezadeira:'Rezadeira',frade:'Frade'};
const AVS=['coronel','jagunco','cangaceiro','rezadeira','mascate','frade'];
const A='assets/';
const ACTS={renda:{n:'Renda'},ajuda:{n:'Ajuda Externa',b:['coronel']},golpe:{n:'Golpe de Estado',t:1,cost:7},taxar:{n:'Taxar',r:'coronel'},extorquir:{n:'Extorquir',r:'cangaceiro',t:1,b:['cangaceiro','mascate','frade']},assassinar:{n:'Assassinar',r:'jagunco',t:1,cost:3,b:['rezadeira']},trocar:{n:'Trocar (2)',r:'mascate'},trocar1:{n:'Trocar (1)',r:'frade'},investigar:{n:'Investigar',r:'frade',t:1}};
const ALAB={renda:'Renda +1',ajuda:'Ajuda +2',golpe:'Golpe',taxar:'Taxar +3',extorquir:'Extorquir',assassinar:'Assassinar',trocar:'Trocar',trocar1:'Trocar',investigar:'Investigar'},COST={golpe:7,assassinar:3};
const INFO={coronel:'Taxar: +3 moedas · bloqueia a Ajuda Externa',cangaceiro:'Extorquir: pega 2 moedas · bloqueia extorsão',jagunco:'Assassinar: paga 3 moedas, o alvo perde uma influência',rezadeira:'Bloqueia o assassinato',mascate:'Trocar: compra 2, devolve 2 · bloqueia extorsão',frade:'Trocar (1) ou Investigar · bloqueia extorsão'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mn=(f,s)=>`<span class="mn${s?' s':''}"><img src="${A}${f}" alt=""></span>`;
const chip=r=>mn(`miniatura/${r}.webp`);
const ico=(k,s)=>mn(`ui/${k}.webp`,s);
const IC=(n,c='')=>`<i class="ic ${c}" style="--i:url(${A}icons/${n}.svg)"></i>`;
const cardImg=(r,dead)=>`<span class="card"><img src="${A}${dead?'cards-perdeu':'cards'}/${r}.webp" alt="${RK[r]}"></span>`;
const miniCard=c=>`<span class="mc"><img src="${A}mini/${c.k==='back'?'verso':c.k==='hid'?'escondida':c.r}.webp" alt=""></span>`;
const pf=r=>`<img class="pf" src="${A}perfil/${r}.webp" alt="">`;
const actLab=k=>(ACTS[k].r?chip(ACTS[k].r):ico(k==='golpe'?'golpe':'moeda'))+ALAB[k]+(COST[k]?`<i class="cst">−${COST[k]}</i>`:'');
const optLab=(o,r)=>(r?chip(r):o==='Contestar'?ico('contestar'):o==='Forçar troca'?ico('reload'):o==='Deixar passar'||o==='Deixar com ele'?ico('passar'):'')+o;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=a=>a[Math.random()*a.length|0];
const sh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const setH=(el,h)=>{if(el._h!==h){el._h=h;el.innerHTML=h;return 1}};
const ST=(k,v)=>{try{return v===undefined?localStorage.getItem(k):v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){return null}};
let P,deck,log=[],tg=null,bid=0,OPT={reveal:1,n:8},lastSt='',maxAsk=0;
let pid=ST('pid');if(!pid){pid=Array.from(window.crypto&&crypto.getRandomValues?crypto.getRandomValues(new Uint8Array(14)):Array.from({length:14},()=>Math.random()*256|0),b=>(b%36).toString(36)).join('');ST('pid',pid)}
let me={name:ST('nm')||'',av:(+ST('av')||0)%6},es=null,snap=null,lastEv=0,evq=Promise.resolve(),dl=0;

function paint(v){
 setH($('#st'),v.st);lastSt=v.st;
 setH($('#tb'),`<button class="ib rg mini" data-t="back" aria-label="Voltar">${IC('arrow')}</button><div class="rt rg">${v.room}</div><button class="ib rg mini" data-t="info" aria-label="Histórico">${IC('info')}</button>`);
 const o=$('#opp');o.className=(v.opp.length>=7||innerWidth<900)?'dense':'';
 setH(o,v.opp.map(p=>`<div class="tile${p.out?' out':''}${p.turn?' turn':''}${p.tgt?' tgt':''}${p.on===false?' offl':''}" data-p="${p.id}"><div class="th"><span class="nm">${esc(p.name)}</span><span class="co">${ico('moeda',1)}<b>${p.coins}</b></span></div><div class="tc">${p.cards.map(miniCard).join('')}</div></div>`).join(''));
 const m=v.me;
 setH($('#mine'),`<div class="hand${m.turn?' turn':''}${m.out?' out':''}"><div class="th"><span class="nm">você</span><span class="co">${ico('moeda',1)}<b>${m.coins}</b></span></div><div class="hc">${m.cards.map(c=>cardImg(c.r,c.d)).join('')}</div></div>`);
 const lg=$('#log');if(setH(lg,'<h4>HISTÓRICO</h4>'+v.log.slice(-30).map(x=>`<p>${x}</p>`).join('')))lg.scrollTop=1e9}
function closeOv(){const v=$('#ov');v.className='';v.innerHTML='';v.onclick=null}
function modal(inner,h){const v=$('#ov');v.className='on';v.innerHTML=`<div class="mw"><div class="modal rg">${inner}</div><button class="ib rg x" data-x>${IC('close')}</button></div>`;v.onclick=e=>{if(e.target===v||e.target.closest('[data-x]'))return closeOv();h&&h(e)}}
function banner(o){return new Promise(res=>{const id=++bid,v=$('#ov');v.className='on'+(o.soft?' soft':'');
 v.innerHTML=`<div class="bn ${o.cls||''}">${o.card?cardImg(o.card):o.back?`<div class="bk"><img src="${A}mini/verso.webp" alt=""></div>`:''}<h2>${o.title}</h2>${o.sub?`<p>${o.sub}</p>`:''}</div>`;
 let done=0;const end=()=>{if(done)return;done=1;if(bid===id){v.className='';v.innerHTML=''}res()};setTimeout(end,o.ms||1800);v.onclick=o.soft?null:end;if(o.soft)res()})}
const tgRow=(l,k,v)=>`<div class="opt"><span>${l}</span><div class="tg" data-o="${k}"><button data-v="1" class="${v?'on':''}">ON</button><button data-v="0" class="off ${v?'':'on'}">OFF</button></div></div>`;
const optText=()=>`${OPT.n} jogadores · carta perdida ${OPT.reveal?'revelada':'escondida'}`;

function showMenu(){document.body.className='menu';renderMenu()}
function renderMenu(){setH($('#menu'),`<div class="logo-box"><i class="sun"></i><img class="logo" src="${A}logo.webp" alt="LÁBIA"></div><div class="mb"><button class="btn rg big" data-m="hub">${IC('start')}JOGAR</button><p class="cur">${optText()}</p><div class="irow"><button class="ib rg" data-m="help" aria-label="Como jogar">${IC('tutorial')}</button><button class="ib rg" data-m="tr" aria-label="Treino">${IC('treino')}</button><button class="ib rg" data-m="chars" aria-label="Personagens">${IC('info')}</button><button class="ib rg" data-m="cfg" aria-label="Configurações">${IC('eng')}</button></div></div>`)}
function sheet(k){
 if(k==='cfg')return modal(`<h2>TREINO</h2>${tgRow('Revelar carta?','reveal',OPT.reveal)}<div class="opt"><span>Jogadores</span><div class="tg n" data-o="n">${[3,4,5,6,7,8,9,10].map(x=>`<button data-v="${x}" class="${OPT.n===x?'on':''}">${x}</button>`).join('')}</div></div>`,e=>{const b=e.target.closest('[data-v]');if(!b)return;OPT[b.parentElement.dataset.o]=+b.dataset.v;sheet('cfg');renderMenu()});
 if(k==='help')return modal(`<h2>COMO JOGAR</h2><p>Seja o último com influência (carta) viva. No seu turno escolha uma ação: você pode dizer a verdade ou blefar. Qualquer jogador pode contestar uma ação de personagem; quem errar perde uma influência. Alguns personagens bloqueiam ações dos outros.</p><ul><li><b>Renda:</b> +1 moeda</li><li><b>Ajuda externa:</b> +2 moedas (o Coronel bloqueia)</li><li><b>Golpe de Estado:</b> paga 7, o alvo perde influência. Obrigatório com 10+ moedas</li></ul>`);
 if(k==='chars')return modal('<h2>PERSONAGENS</h2>'+Object.keys(RK).map(r=>`<div class="ch">${chip(r)}<div><b>${RK[r]}</b><small>${INFO[r]}</small></div></div>`).join(''))}

/* ===== TREINO ===== */
const alive=p=>p.cards.filter(c=>!c.dead);
const has=(p,r)=>alive(p).some(c=>c.r===r);
function draw(){const t=P.find(x=>x.turn),m=P.find(x=>x.me);
 paint({st:`Baralho: <b>${deck.length}</b> · ${P.filter(x=>!x.out).length} em jogo`+(t?` · Vez de <b>${t.me?'você':t.name}</b>`:'')+' · Treino',room:'<b>TREINO</b>',
 opp:P.filter(p=>!p.me).map(p=>({id:P.indexOf(p),name:p.name,coins:p.coins,out:p.out,turn:p.turn,tgt:!!(tg&&tg.ids.includes(P.indexOf(p))),cards:p.cards.map(c=>c.dead?(OPT.reveal?{k:'dead',r:c.r}:{k:'hid'}):{k:'back'})})),
 me:{coins:m.coins,out:m.out,turn:m.turn,cards:m.cards.map(c=>({r:c.r,d:c.dead}))},log})}
const say=t=>{log.push(t);draw()};
const qHTML=(q,btns,two)=>`<div class="qh"><span class="q">${q}</span><small class="cd"></small></div>`+(btns?`<div class="bts${two?' two':''}">${btns}</div>`:'');
function ask(q,opts,two){return new Promise(res=>{const a=$('#ask');a.innerHTML=qHTML(q,opts.map((o,i)=>`<button class="btn rg or sm" data-i="${i}" data-k="${i+1}">${o}</button>`).join(''),two);a.onclick=e=>{const b=e.target.closest('button');if(b){a.innerHTML='';a.onclick=null;res(+b.dataset.i)}}})}
async function lose(p,why=''){const a=alive(p);if(!a.length)return;let c=a[0];if(a.length>1)c=p.me?a[await ask('Qual influência você perde?',a.map(x=>chip(x.r)+RK[x.r]))]:rnd(a);
 c.dead=1;say(`${p.name} perdeu `+(OPT.reveal||p.me?RK[c.r]:'uma influência')+'.');if(!alive(p).length){p.out=1;say(`${p.name} foi eliminado.`)}draw();
 const show=OPT.reveal||p.me;await banner({card:show?c.r:null,back:!show,cls:p.me?'bad':'',title:p.out?(p.me?'Você foi eliminado':`${p.name} foi eliminado`):(p.me?'Você perdeu uma influência':`${p.name} perdeu uma influência`),sub:why})}
async function challenge(cl,role){for(const o of P.filter(x=>!x.out&&x!==cl)){
 const go=o.me?(await ask(`${cl.name} diz ser ${chip(role)}${RK[role]}. Contestar?`,[ico('contestar')+'Contestar',ico('passar')+'Deixar passar']))===0:Math.random()<.4/P.length;
 if(go){say(`${o.name} contesta ${cl.name}!`);
  if(has(cl,role)){say(`${cl.name} mostra ${RK[role]}! ${o.name} perde uma influência.`);const c=alive(cl).find(c=>c.r===role);deck.push(c.r);sh(deck);c.r=deck.shift();await lose(o,`${cl.name} tinha ${RK[role]}!`);return true}
  say(`${cl.name} estava blefando!`);await lose(cl,'Blefe descoberto!');return false}}return true}
async function block(actor,roles,t,nm){for(const b of t?[t]:P.filter(x=>!x.out&&x!==actor)){if(b.out)continue;let r=null;
 if(b.me){const i=await ask(`${actor.name} tenta ${nm}. Bloquear?`,[...roles.map(x=>chip(x)+'Bloquear como '+RK[x]),ico('passar')+'Deixar passar']);r=roles[i]||null}
 else{const own=roles.find(x=>has(b,x));if(Math.random()<(own?.6:.08)*(t?1:4/P.length))r=own||rnd(roles)}
 if(r){say(`${b.name} bloqueia com ${RK[r]}!`);if(await challenge(b,r))return true}}return false}
async function swap(p,n){const d=deck.splice(0,n),pool=[...alive(p),...d.map(r=>({r}))],keep=alive(p).length;
 while(pool.length>keep){const i=p.me?await ask('Devolva uma carta ao baralho:',pool.map(c=>chip(c.r)+RK[c.r])):Math.random()*pool.length|0;deck.push(pool.splice(i,1)[0].r)}
 sh(deck);const rs=pool.map(c=>c.r);alive(p).forEach((c,i)=>c.r=rs[i]);say(`${p.name} trocou ${n} carta(s).`)}
async function probe(p,t){const a=alive(t);const c=t.me&&a.length>1?a[await ask('Mostre uma carta ao Frade:',a.map(x=>chip(x.r)+RK[x.r]))]:rnd(a);
 let sw;if(p.me)sw=(await ask(`${t.name} mostrou ${chip(c.r)}${RK[c.r]}. O que fazer?`,[ico('passar')+'Deixar com ele',ico('reload')+'Forçar troca']))===1;else{sw=Math.random()<.5;say(`${p.name} olhou uma carta de ${t.name}.`)}
 if(sw){deck.push(c.r);sh(deck);c.r=deck.shift();say(`${t.name} foi forçado a trocar a carta.`)}else say(`${t.name} ficou com a carta.`)}
function pickTarget(foes){return new Promise(res=>{tg={ids:foes.map(f=>P.indexOf(f)),res};$('#ask').innerHTML=qHTML('Toque em um adversário para escolher o alvo','');draw();$('#opp').scrollIntoView({block:'nearest',behavior:'smooth'})})}
function botPick(p){if(p.coins>=10||(p.coins>=7&&Math.random()<.6))return'golpe';
 const ks=Object.keys(ACTS).filter(k=>k!=='golpe'&&p.coins>=(ACTS[k].cost||0)),own=ks.filter(k=>ACTS[k].r&&has(p,ACTS[k].r));return rnd(own.length&&Math.random()<.6?own:ks)}
async function turn(p){P.forEach(x=>x.turn=x===p?1:0);draw();let k;
 if(p.me){banner({soft:1,title:'Sua vez!',ms:1000});const must=p.coins>=10,ks=Object.keys(ACTS).filter(k=>p.coins>=(ACTS[k].cost||0)&&(!must||k==='golpe'));k=ks[await ask('Sua vez! Escolher ação:',ks.map(actLab),1)]}
 else{k=botPick(p);await sleep(600)}
 const Ac=ACTS[k],foes=P.filter(x=>!x.out&&x!==p);let t=null;
 if(Ac.t)t=p.me?await pickTarget(foes):rnd(foes);
 say(`<b>${p.name}</b>: ${Ac.n}${t?' em '+t.name:''}${Ac.r?' (diz ser '+RK[Ac.r]+')':''}.`);
 if(t&&t.me)banner({soft:1,title:'Você é o alvo!',sub:Ac.n,ms:1500});
 p.coins-=Ac.cost||0;draw();
 if(Ac.r&&!await challenge(p,Ac.r)){p.coins+=Ac.cost||0;draw();return}
 if(p.out||(t&&t.out))return;
 if(Ac.b&&await block(p,Ac.b,t,Ac.n)){draw();return}
 if(p.out)return;
 if(k==='renda')p.coins++;if(k==='ajuda')p.coins+=2;if(k==='taxar')p.coins+=3;
 if(k==='extorquir'){const n=Math.min(2,t.coins);t.coins-=n;p.coins+=n}
 if(k==='golpe'||k==='assassinar')await lose(t,k==='golpe'?'Golpe de Estado!':'Assassinado!');
 if(k==='trocar')await swap(p,2);if(k==='trocar1')await swap(p,1);if(k==='investigar')await probe(p,t);draw()}
async function game(){
 const n=OPT.n,cp=n<=6?3:n<=8?4:5;document.body.className='play';maxAsk=250;
 deck=sh(Object.keys(RK).flatMap(r=>Array(cp).fill(r)));
 P=['Você','Zé Piaba','Dona Chica','Seu Nonato','Bia do Cordel','Tião','Sinhá Maria','Compadre Totó','Nega Lia','Raimundo'].slice(0,n).map((name,i)=>({name,me:i===0,coins:2,cards:[{r:deck.shift()},{r:deck.shift()}]}));
 log=[];say(`Que comece o jogo! ${n} jogadores, ${cp} cartas de cada personagem.`);
 let i=0;while(P.filter(x=>!x.out).length>1){const p=P[i++%P.length];if(p.out)continue;await turn(p);await sleep(500)}
 const w=P.find(x=>!x.out);P.forEach(x=>x.turn=0);draw();
 await banner({cls:w.me?'win':'',title:w.me?'Você venceu!':`${w.name} venceu`,sub:w.me?'O sertão é seu!':'Mais sorte na próxima.',ms:3000});
 ask(w.me?'Você venceu!':w.name+' venceu.',['Jogar de novo','Menu inicial']).then(r=>r===0?game():showMenu())}

/* ===== ONLINE ===== */
const api=async b=>{try{const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...b,pid})});return await r.json()}catch(e){return{err:'Sem conexão com o servidor.'}}};
function hub(code){modal(`<h2>JOGAR ONLINE</h2><label>APELIDO</label><input id="nm" maxlength="14" placeholder="Seu nome" value="${esc(me.name)}"><div class="avs">${AVS.map((r,i)=>`<button class="av${me.av===i?' on':''}" data-a="${i}" aria-label="${RK[r]}">${pf(r)}</button>`).join('')}</div><button class="btn rg" data-h="new">CRIAR SALA</button><div class="row"><input id="cd" maxlength="4" placeholder="Código" value="${esc(code||'')}" style="text-transform:uppercase"><button class="btn rg mini" data-h="join">ENTRAR</button></div><p id="er" class="er"></p>`,async e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.a!=null){me.av=+b.dataset.a;document.querySelectorAll('.av').forEach((x,i)=>x.classList.toggle('on',i===me.av));return}
 if(!b.dataset.h)return;const nm=$('#nm').value.trim();if(!nm){$('#er').textContent='Escolha um apelido.';return}
 me.name=nm;ST('nm',nm);ST('av',me.av);$('#er').textContent='Conectando… (na primeira vez pode levar cerca de 1 minuto)';
 const r=b.dataset.h==='new'?await api({t:'create',name:nm,av:me.av}):await api({t:'join',room:$('#cd').value.trim().toUpperCase(),name:nm,av:me.av});
 if(r.err){$('#er').textContent=r.err;return}closeOv();connect(r.code)})}
function connect(code){ST('room',code);maxAsk=250;snap=null;lastEv=0;if(es)es.close();try{history.replaceState(null,'',location.pathname)}catch(e){}
 es=new EventSource(`/events?room=${code}&pid=${pid}`);
 es.onmessage=m=>{const s=JSON.parse(m.data),first=!snap;snap=s;if(first)lastEv=s.evn;else{s.evs.filter(e=>e.id>lastEv).forEach(play);lastEv=s.evn}render()};
 es.addEventListener('gone',()=>{es.close();es=null;snap=null;ST('room',null);showMenu()});
 es.onerror=()=>{if(snap&&document.body.className==='play'){$('#st').textContent='Reconectando…';const t=$('#tb');t._h=null;const r=t.querySelector('.rt');if(r)r.textContent='RECONECTANDO…'}};
 $('#ask').onclick=e=>{const b=e.target.closest('button');if(!b||!snap)return;const a=$('#ask');
  if(b.dataset.e==='again'){api({t:'start',room:snap.code}).then(r=>r.err&&alert(r.err));return}
  if(b.dataset.e==='leave'){leave();return}
  if(snap.pr&&b.dataset.i!=null){const id=snap.pr.id;a.innerHTML='';a.dataset.pk='x';api({t:'ans',room:snap.code,id,i:+b.dataset.i})}}}
async function leave(){const c=snap&&snap.code;if(es)es.close();es=null;snap=null;ST('room',null);$('#ask').onclick=null;if(c)await api({t:'leave',room:c});showMenu()}
function pill(p,host){const r=AVS[p.av%6];return `<div class="pill${p.on?'':' off'}">${pf(r)}<span>${esc(p.name)}</span>${p.bot?IC('rob','rob'):''}${host&&p.bot?`<button class="ib rg mini" data-m="rm" data-id="${p.id}" aria-label="Remover bot">${IC('close')}</button>`:''}</div>`}
function lobby(s){const host=s.host===pid,n=s.players.length;
 setH($('#menu'),`<div class="top"><button class="ib rg" data-m="leave" aria-label="Sair da sala">${IC('arrow')}</button>${host?`<button class="ib rg" data-m="rcfg" aria-label="Configurações">${IC('eng')}</button>`:'<span></span>'}</div><div class="room rg"><p>SALA</p><div class="code">${s.code}</div><button class="btn rg" data-m="share">CONVIDAR JOGADOR</button></div><div class="pls">${s.players.map(p=>pill(p,host)).join('')}${host&&s.opts.bots&&n<10?`<button class="pill add" data-m="bot">${IC('add','rob')}<span>BOT</span></button>`:''}</div><div class="foot"><p class="cur">${n}/10 jogadores · carta perdida ${s.opts.reveal?'revelada':'escondida'}</p>${host?`<button class="btn rg big" data-m="start">${IC('start')}COMEÇAR</button>`:'<p class="wait">Aguardando o anfitrião começar…</p>'}</div>`)}
function roomCfg(){const o=snap.opts;modal(`<h2>CONFIGURAÇÕES</h2>${tgRow('Revelar carta?','reveal',o.reveal)}${tgRow('Bots','bots',o.bots)}`,async e=>{const b=e.target.closest('[data-v]');if(!b)return;const k=b.parentElement.dataset.o,v=+b.dataset.v;snap.opts[k]=v;roomCfg();await api({t:'opts',room:snap.code,[k]:v})})}
function render(){const s=snap;if(!s)return;
 if(s.phase==='lobby'){document.body.className='menu';lobby(s);return}
 document.body.className='play';
 const t=s.players.find(p=>p.turn),m=s.players.find(p=>p.id===pid)||{cards:[],coins:0},tgs=s.pr&&s.pr.kind==='target'?s.pr.ids:[];
 paint({st:`Baralho: <b>${s.deck}</b> · ${s.players.filter(x=>!x.out).length} em jogo`+(t?` · Vez de <b>${t.id===pid?'você':esc(t.name)}</b>`:'')+` · Sala ${s.code}`,room:`<span>SALA</span> <b>${s.code}</b>`,
  opp:s.players.filter(p=>p.id!==pid).map(p=>({id:p.id,name:p.name,on:p.on,coins:p.coins,out:p.out,turn:p.turn,tgt:tgs.includes(p.id),cards:p.cards.map(c=>c.d?(c.r?{k:'dead',r:c.r}:{k:'hid'}):{k:'back'})})),
  me:{coins:m.coins,out:m.out,turn:m.turn,cards:m.cards.map(c=>({r:c.r,d:c.d}))},log:s.log});
 const a=$('#ask'),p=s.pr;
 if(!p){if(s.phase==='end'){if(a.dataset.pk!=='end'){a.dataset.pk='end';a.innerHTML=(s.host===pid?'<button class="btn rg or sm" data-e="again">Jogar de novo</button>':'<p class="q">Aguardando o anfitrião…</p>')+'<button class="btn rg or sm" data-e="leave">Sair da sala</button>'}}else{a.innerHTML='';a.dataset.pk=''}return}
 if(a.dataset.pk==p.id)return;a.dataset.pk=p.id;dl=Date.now()+p.left;
 if(p.kind==='target'){a.innerHTML=qHTML('Toque em um adversário para escolher o alvo','');return}
 const labs=p.kind==='act'?p.ks.map(actLab):p.opts.map((o,i)=>optLab(o,p.rls&&p.rls[i])),q=p.rl?`${esc(p.q)} ${chip(p.rl)}${RK[p.rl]}. Contestar?`:esc(p.q||'');
 a.innerHTML=qHTML(q,labs.map((l,i)=>`<button class="btn rg or sm" data-i="${i}" data-k="${i+1}">${l}</button>`).join(''),p.kind==='act')}
setInterval(()=>{const c=document.querySelector('#ask .cd');if(c&&dl&&snap&&snap.pr)c.textContent=Math.max(0,Math.ceil((dl-Date.now())/1000))+'s'},500);
function play(e){const n=id=>esc((snap.players.find(p=>p.id===id)||{}).name||'?'),mine=e.who===pid;
 if(e.k==='lose')evq=evq.then(()=>banner({card:e.card||null,back:!e.card,cls:mine?'bad':'',title:e.out?(mine?'Você foi eliminado':`${n(e.who)} foi eliminado`):(mine?'Você perdeu uma influência':`${n(e.who)} perdeu uma influência`),sub:e.why}));
 else if(e.k==='turn'&&e.to===pid)banner({soft:1,title:'Sua vez!',ms:1000});
 else if(e.k==='tgt'&&e.to===pid)banner({soft:1,title:'Você é o alvo!',sub:e.sub,ms:1500});
 else if(e.k==='win')evq=evq.then(()=>banner({cls:mine?'win':'',title:mine?'Você venceu!':`${n(e.who)} venceu`,sub:mine?'O sertão é seu!':'Mais sorte na próxima.',ms:3000}))}
async function share(){const u=location.origin+'/?sala='+snap.code,t='Vem jogar LÁBIA comigo! Sala '+snap.code;try{if(navigator.share)await navigator.share({title:'LÁBIA',text:t,url:u});else{await navigator.clipboard.writeText(t+' '+u);alert('Link copiado!')}}catch(e){}}
async function boot(){const q=new URLSearchParams(location.search).get('sala'),sv=ST('room');
 if(sv&&!q){const r=await api({t:'join',room:sv,name:me.name||'Jogador',av:me.av});if(r.code){connect(r.code);return}ST('room',null)}
 showMenu();if(q)hub(q.toUpperCase().slice(0,4))}
$('#menu').onclick=async e=>{const b=e.target.closest('[data-m]');if(!b)return;const m=b.dataset.m;
 if(m==='hub')hub();else if(m==='tr')game();else if(m==='share')share();
 else if(m==='cfg'||m==='help'||m==='chars')sheet(m);
 else if(m==='bot')api({t:'bot',room:snap.code});
 else if(m==='rm')api({t:'rmbot',room:snap.code,id:b.dataset.id});
 else if(m==='rcfg')roomCfg();
 else if(m==='start'){const r=await api({t:'start',room:snap.code});if(r.err)alert(r.err)}
 else if(m==='leave')leave()};
$('#opp').addEventListener('click',e=>{const el=e.target.closest('.tgt');if(!el)return;
 if(tg){const r=tg.res;tg=null;$('#ask').innerHTML='';draw();r(P[+el.dataset.p]);return}
 if(snap&&snap.pr&&snap.pr.kind==='target'){const i=snap.pr.ids.indexOf(el.dataset.p);if(i<0)return;const id=snap.pr.id;$('#ask').innerHTML='';$('#ask').dataset.pk='x';api({t:'ans',room:snap.code,id,i})}});
addEventListener('keydown',e=>{const b=document.querySelector(`#ask button[data-i="${+e.key-1}"]`);if(b)b.click()});
function openHistory(){modal(`<h2>HISTÓRICO</h2><p class="hs">${lastSt}</p><div class="hl">${(es&&snap?snap.log:log).slice(-60).map(x=>`<p>${x}</p>`).join('')}</div>`)}
$('#tb').onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;
 if(b.dataset.t==='info')openHistory();
 else if(confirm(es?'Sair da sala?':'Voltar ao menu? A partida de treino será encerrada.')){if(es)leave();else location.reload()}};
function fit(){const lay=$('.lay');
 if(document.body.className!=='play'||innerWidth>=900){lay.style.zoom='';lay.style.minHeight='';$('#ask').style.minHeight='';return}
 lay.style.zoom=1;lay.style.minHeight='';const ask=$('#ask');ask.style.minHeight='0';
 maxAsk=Math.max(maxAsk,ask.offsetHeight);ask.style.minHeight=maxAsk+'px';
 const m=$('main'),cs=getComputedStyle(m),avail=m.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom),h=lay.scrollHeight,z=Math.max(.5,Math.min(1,avail/h));
 lay.style.zoom=z;lay.style.minHeight=(avail/z)+'px'}
let fq=0;const fitSoon=()=>{cancelAnimationFrame(fq);fq=requestAnimationFrame(fit)};
new MutationObserver(fitSoon).observe($('.lay'),{childList:true,subtree:true,characterData:true});
new MutationObserver(fitSoon).observe(document.body,{attributes:true,attributeFilter:['class']});
addEventListener('resize',()=>{maxAsk=250;$('#opp').className=($('#opp').className.includes('dense')&&innerWidth<900)||document.querySelectorAll('#opp .tile').length>=7?'dense':'';fitSoon()});
addEventListener('orientationchange',()=>{maxAsk=250;fitSoon()});
if(document.fonts)document.fonts.ready.then(fitSoon);
boot();
</script></body></html>
